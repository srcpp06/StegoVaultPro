name: Flutter CI/CD
on:
  push:
    branches: [ main, develop, Stego ]
  pull_request:
    branches: [ main, develop, Stego ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: false
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Create Inno Setup script
        shell: bash
        run: |
          mkdir -p installer
          cat > installer/setup.iss << 'EOF'
          [Setup]
          AppName=StegoVaultPro
          AppVersion=1.0
          DefaultDirName={autopf}\StegoVaultPro
          DefaultGroupName=StegoVaultPro
          OutputDir=..\installer_output
          OutputBaseFilename=StegoVaultPro-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "..\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\StegoVaultPro"; Filename: "{app}\stegovault_pro.exe"
          Name: "{commondesktop}\StegoVaultPro"; Filename: "{app}\stegovault_pro.exe"
          EOF
      - name: Build installer
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer_output/StegoVaultPro-Setup.exe

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: false
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Download appimagetool
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          BINARY_NAME=$(find build/linux/x64/release/bundle -maxdepth 1 -type f -executable | head -n 1 | xargs basename)
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
      - name: Create desktop file and icon
        run: |
          cat > AppDir/stegovaultpro.desktop << EOF
          [Desktop Entry]
          Name=StegoVaultPro
          Exec=${{ env.BINARY_NAME }}
          Icon=stegovaultpro
          Type=Application
          Categories=Utility;
          EOF
          # Placeholder icon agar loyihada icon topilmasa
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/stegovaultpro.png
          else
            sudo apt-get install -y imagemagick
            convert -size 256x256 xc:blue AppDir/stegovaultpro.png
          fi
      - name: Build AppImage
        run: |
          ./appimagetool AppDir StegoVaultPro-x86_64.AppImage
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: StegoVaultPro-x86_64.AppImage

  release:
    name: Create Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-files
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/*"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
