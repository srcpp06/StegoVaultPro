name: steganography_app
description: Steganography - Rasm, Audio, Video, Hujjat ichiga fayl yashirish
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  image: ^4.1.3
  crypto: ^3.0.3
  path_provider: ^2.1.4
  path: ^1.9.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1  # eng barqaror versiya
  rename_app: ^1.6.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/logo.jpg"   # jpg o'rniga png tavsiya (shaffof fon uchun yaxshi)
  adaptive_icon_background: "#000000"   # qora fon, neon logoga mos
  adaptive_icon_foreground: "assets/image/logo.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
